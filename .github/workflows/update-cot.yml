name: Weekly COT Data Fetcher

on:
  schedule:
    # Runs every Friday at 21:00 UTC (4 PM EST / 9 PM UTC)
    - cron: '0 21 * * 5'
  workflow_dispatch: # Allows manual trigger

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download and Unzip CFTC Data
        run: |
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               -o deacot.zip "https://www.cftc.gov/files/dea/history/deacot2026.zip"
          unzip -o deacot.zip
          rm deacot.zip
          mv *.txt cot_data_2026.csv

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cot_data_2026.csv
          git commit -m "Update COT Data for 2026" || exit 0
          git push
